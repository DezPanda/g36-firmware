# uMTP-Responder config for the G36: file transfer over USB (MTP).
# Turned on and off by g36-filetransfer; the factory usbdevice script starts umtprd.

loop_on_disconnect 1
# write each file to the card as soon as the computer finishes sending it
sync_when_close 1
# hide dot-files (the handheld's own housekeeping, macOS clutter)
show_hidden_files 0

storage "/mnt/sdcard" "G36-GAMES" "rw"
storage "/mnt/emu"    "G36-EMU"   "rw"

manufacturer "G36"
product "G36 Handheld"
serial "G36"
firmware_version "1.0"
interface "MTP"

usb_functionfs_mode 0x1
usb_dev_path   "/dev/usb-ffs/mtp/ep0"
usb_epin_path  "/dev/usb-ffs/mtp/ep1"
usb_epout_path "/dev/usb-ffs/mtp/ep2"
usb_epint_path "/dev/usb-ffs/mtp/ep3"
usb_max_packet_size 0x200
