# BIOS files each console needs, checked before a game starts. The files go directly
# in bios/ on G36-GAMES (not in subfolders, except where a path says so).
#   <console> | <file> , <file> ...
# Each entry is a file the console needs; "a / b" means either one will do.
# Consoles that aren't listed don't need a BIOS (or the emulator has its own).

fds         | disksys.rom
segacd      | bios_CD_U.bin / bios_CD_E.bin / bios_CD_J.bin
pcenginecd  | syscard3.pce
neogeo      | neogeo.zip
neogeocd    | neocd/neocd_z.rom / neocd/neocd_f.rom / neocd/neocd_t.rom / neocd/front-sp1.bin / neocd/top-sp1.bin / neocd/uni-bioscd.rom , neocd/000-lo.lo / neocd/ng-lo.rom
atari5200   | 5200.rom
atarilynx   | lynxboot.img
