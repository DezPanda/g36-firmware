# G36 settings. Edit on a computer or in the handheld's Settings screen.

# Battery (off the charger): the menu warns at battery_warn_percent; at
# battery_off_percent the handheld saves and powers off by itself, in a game too.
# The battery reading is rough, so these leave a safe margin; lower them if you like.
battery_warn_percent = 20
battery_off_percent = 10

# Untouched in the menu (off the charger): the screen turns off after
# screen_off_seconds, and the handheld saves and powers off after
# auto_power_off_minutes. 0 = never. Neither happens on a charger or computer.
screen_off_seconds = 180
auto_power_off_minutes = 10

# USB debugging (ADB): a command line for developers over the USB cable. Off by default. Turn it
# on here (1) or in Settings > USB debugging. File transfer works without it.
usb_debugging = 0
