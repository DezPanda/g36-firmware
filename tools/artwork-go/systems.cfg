# G36 menu systems. One system per line:
#   folder | display name | file types | emulators
# folder:     subfolder of roms/ (ES-DE folder names)
# file types: extensions the menu lists (anything else in the folder is ignored)
# emulators:  core names in G36-EMU/cores/ without "_libretro.so"; the first is the default,
#             the rest are offered by the emulator picker (hold Select + press A).
# Systems are shown in this order; systems with no games are hidden.
# Not listed: N64 and PSP - their emulators need a GPU, which this handheld lacks.

